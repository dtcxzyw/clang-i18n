name: Build

on:
  workflow_dispatch:
  workflow_call:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LLVM 18-20 are only packaged for Ubuntu 24.04 (noble).
          - version: 18
            os: ubuntu-24.04
            distro: noble
            repo: llvm-toolchain-noble-18
          - version: 19
            os: ubuntu-24.04
            distro: noble
            repo: llvm-toolchain-noble-19
          - version: 20
            os: ubuntu-24.04
            distro: noble
            repo: llvm-toolchain-noble-20
          - version: 21
            os: ubuntu-26.04
            distro: resolute
            repo: llvm-toolchain-resolute-21
          - version: 22
            os: ubuntu-26.04
            distro: resolute
            repo: llvm-toolchain-resolute-22
          - version: 23
            os: ubuntu-26.04
            distro: resolute
            repo: llvm-toolchain-resolute-23
          # The development version lives in the unversioned repository.
          - version: 24
            os: ubuntu-26.04
            distro: resolute
            repo: llvm-toolchain-resolute
            extra_packages: libmlir-24-dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies (Linux)
      run: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --batch --yes -o /etc/apt/keyrings/llvm-snapshot.gpg
        sudo chmod 644 /etc/apt/keyrings/llvm-snapshot.gpg
        echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/${{ matrix.distro }}/ ${{ matrix.repo }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        # Workaround for issue https://github.com/llvm/llvm-project/issues/133861
        sudo ln -s /usr/lib/llvm-${{ matrix.version }}/lib /usr/lib/lib
        sudo ln -s /usr/lib/llvm-${{ matrix.version }}/include /usr/lib/include
        sudo apt-get update
        sudo apt-get install ninja-build clang-${{ matrix.version }} llvm-${{ matrix.version }}-dev libclang-${{ matrix.version }}-dev ${{ matrix.extra_packages || '' }}

    - name: Work around incomplete LLVM/MLIR APT packages
      run: |
        sudo python3 - <<'EOF'
        import glob, os, re

        prefix = "/usr/lib/llvm-${{ matrix.version }}"
        for path in glob.glob(f"{prefix}/lib/cmake/*/*Targets*.cmake"):
            text = open(path).read().replace("${_IMPORT_PREFIX}", prefix)
            for ref in sorted(set(re.findall(r'"([^"]+)"', text))):
                is_lib = ref.startswith(f"{prefix}/lib/") and "." in os.path.basename(ref)
                is_tool = ref.startswith(f"{prefix}/bin/")
                if (is_lib or is_tool) and not os.path.exists(ref):
                    print(f"Creating placeholder for {ref}")
                    os.makedirs(os.path.dirname(ref), exist_ok=True)
                    open(ref, "w").close()
        EOF

    - name: Build clang-i18n
      run: |
        mkdir build && cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release .. -DLLVM_DIR=/usr/lib/llvm-${{ matrix.version }}/lib/cmake/llvm -DClang_DIR=/usr/lib/llvm-${{ matrix.version }}/lib/cmake/clang
        cmake --build . -j

    - name: Append clang version to clang-i18n artifacts
      id: append_clang_version
      run: |
        cd build
        clang_version=$(clang-${{ matrix.version }} --version | grep -oP 'version \K[0-9.]+' --color=never | tr -d '\n')
        echo "Clang version: $clang_version"
        mkdir -p artifacts
        cp libclang-i18n.so artifacts/libclang-i18n.so.$clang_version
        cp libllvm-i18n.so artifacts/libllvm-i18n.so.$clang_version
        echo "clang_version=$clang_version" >> "$GITHUB_OUTPUT"

    - name: Upload artifacts
      id: artifacts
      uses: actions/upload-artifact@v7
      if: startsWith(github.ref, 'refs/tags/')
      with: 
        path: build/artifacts
        name: artifacts-${{ github.run_id }}-${{ matrix.version }}
        retention-days: 7
